<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        /* Đồng bộ CSS giống trang đăng nhập để đồng nhất giao diện */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .auth-box {
            background: #ffffff;
            max-width: 400px;
            width: 100%;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #9b59b6;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .auth-switch a {
            color: #9b59b6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2 class="auth-title">Đăng Ký </h2>
        
        <form id="form-register">
            <div class="form-group">
                <label for="reg-name">Họ và tên</label>
                <input type="text" id="reg-name" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Địa chỉ Email</label>
                <input type="email" id="reg-email" placeholder="Nhập email" required>
            </div>
            
            <div class="form-group">
                <label for="reg-password">Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu" required>
            </div>

            <div class="form-group">
                <label for="reg-confirm">Xác nhận mật khẩu</label>
                <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu" required>
            </div>
            
            <button type="submit" class="btn-submit">Đăng Ký Tài Khoản</button>
        </form>

        <div class="auth-switch">
            Đã có tài khoản? <a>Đăng nhập</a>
        </div>
      <script src="../js/register.js"></script>
    </div>

</body>
</html>
